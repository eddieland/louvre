<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Design directions &middot; Louvre</title>
    <style>
        :root {
            --bg: #0e1014;
            --surface: #161920;
            --line: #262a33;
            --ink: #e9eaef;
            --muted: #9ba1ad;
            --accent: #9b9cfb;
            --accent-ink: #0e1014;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f6f6f8;
                --surface: #ffffff;
                --line: #e2e3e8;
                --ink: #16171c;
                --muted: #5f6470;
                --accent: #4f50c9;
                --accent-ink: #ffffff;
            }
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        main {
            max-width: 640px;
            margin: 0 auto;
            padding: 72px 20px;
        }
        .wordmark {
            margin: 0 0 40px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--muted);
        }
        h1 {
            margin: 0 0 16px;
            font-size: 32px;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }
        p {
            color: var(--muted);
        }
        .card {
            display: block;
            margin: 32px 0;
            padding: 20px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--surface);
            color: inherit;
            text-decoration: none;
        }
        .card:hover {
            border-color: var(--accent);
        }
        .card b {
            display: block;
            margin-bottom: 4px;
        }
        .card span {
            color: var(--muted);
            font-size: 14px;
        }
        .pill {
            display: inline-block;
            margin-bottom: 12px;
            padding: 2px 10px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--accent-ink);
            font-size: 12px;
            font-weight: 600;
        }
        footer {
            margin-top: 56px;
            font-size: 13px;
            color: var(--muted);
        }
        footer a {
            color: var(--muted);
        }
    </style>
</head>
<body>
<main>
    <p class="wordmark"><a href="/" style="color: inherit; text-decoration: none">Louvre</a></p>
    <h1>Design directions</h1>
    <p>
        Each page shows the same artifact and threads in a different look. Hover a thread, click a passage, select a
        few words to comment, and resolve one. On a phone, tap a highlighted passage.
    </p>
{{items}}
</main>
</body>
</html>
