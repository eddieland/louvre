<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Checkout latency &middot; Louvre</title>
    <style>
        :root {
            --bg: #0e1014;
            --surface: #161920;
            --line: #262a33;
            --ink: #e9eaef;
            --muted: #9ba1ad;
            --accent: #9b9cfb;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f6f6f8;
                --surface: #ffffff;
                --line: #e2e3e8;
                --ink: #16171c;
                --muted: #5f6470;
                --accent: #4f50c9;
            }
        }
        * {
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--line);
            background: var(--surface);
        }
        header a {
            color: var(--muted);
            text-decoration: none;
        }
        .home {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
        .title {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 600;
        }
        .meta {
            color: var(--muted);
            white-space: nowrap;
        }
        .raw {
            margin-left: auto;
            white-space: nowrap;
        }
        .stage {
            flex: 1;
            display: flex;
            min-height: 0;
        }
        iframe {
            flex: 1;
            width: 100%;
            border: 0;
            background: var(--bg);
        }
        @media (max-width: 640px) {
            .meta {
                display: none;
            }
        }
    </style>
</head>
<body>
<header>
    <a class="home" href="/">Louvre</a>
    <span class="title">Checkout latency: what we found and what to change</span>
    <span class="meta">v3 &middot; canopy worker, for Sam Okafor</span>
    <a class="raw" href="/a/{{artifact_id}}/content" target="_blank" rel="noopener">Open alone</a>
</header>
<div class="stage">
    <!-- No allow-same-origin: the artifact runs in an opaque origin and cannot read this page or its cookies. -->
    <iframe
        title="Artifact"
        src="/a/{{artifact_id}}/content"
        sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"
        referrerpolicy="no-referrer"
    ></iframe>
</div>
</body>
</html>
