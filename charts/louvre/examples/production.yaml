# Production: a pinned image, two replicas behind TLS, and a managed PostgreSQL (D007) whose password is a Secret made
# outside the chart, for example:
#   kubectl create secret generic louvre-database --from-literal=password='...'
#   helm upgrade --install louvre charts/louvre -f charts/louvre/examples/production.yaml --wait
# Replace every example.com value with your own.
image:
  # A released version; a digest (image.digest) pins it harder.
  tag: "0.1.0"

replicaCount: 2

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: louvre
        app.kubernetes.io/component: web

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: louvre.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: louvre-tls
      hosts: [louvre.example.com]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

postgresql:
  enabled: false

externalDatabase:
  host: louvre.postgres.example.com
  port: 5432
  database: louvre
  username: louvre
  # verify-full also checks the server's certificate against a CA: mount your provider's and point PGSSLROOTCERT at
  # it through extraEnv, or set PGSSLROOTCERT=system when its certificate chains to a public CA.
  sslMode: require
  existingSecret: louvre-database
  existingSecretPasswordKey: password
