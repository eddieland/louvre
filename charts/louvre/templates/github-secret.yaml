{{- /* The GitHub OAuth app's client secret, when it is given in values rather than in a Secret of your own. */}}
{{- $github := .Values.config.github }}
{{- if and $github.clientId (not $github.existingSecret) }}
{{- $missing := "Give the GitHub OAuth app's secret: config.github.existingSecret, or config.github.clientSecret." }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-github" (include "louvre.fullname" .) }}
  labels:
    {{- include "louvre.labels" . | nindent 4 }}
type: Opaque
data:
  client-secret: {{ required $missing $github.clientSecret | b64enc | quote }}
{{- end }}
