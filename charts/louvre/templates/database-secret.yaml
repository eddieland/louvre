{{- /*
The database password, when the chart keeps it: the bundled database's, given or generated, or an external one given
in values. A generated password is read back from the Secret on upgrade, so it stays the one the data was made with.
*/}}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $name := include "louvre.postgresql.fullname" . }}
{{- $password := .Values.postgresql.auth.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password = $existing | dig "data" "password" "" | b64dec | default (randAlphaNum 32) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "louvre.postgresql.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall with the volume it opens, so a reinstall reads the same data.
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- else if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) }}
{{- $missing := "Give the database's password: externalDatabase.existingSecret, or externalDatabase.password." }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-database" (include "louvre.fullname" .) }}
  labels:
    {{- include "louvre.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ required $missing .Values.externalDatabase.password | b64enc | quote }}
{{- end }}
