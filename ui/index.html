<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Dark first (ui/DESIGN.md): the browser's own controls and scrollbars follow the reader's scheme. -->
        <meta name="color-scheme" content="dark light" />
        <!-- Louvre has its own dark theme: tells Dark Reader not to restyle the page over it. -->
        <meta name="darkreader-lock" />
        <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
        <!-- Louvre's mark (ui/public): browsers, a phone's home screen, and Vercel's project avatar read it. -->
        <link rel="icon" href="/favicon.ico" sizes="32x32" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <title>Louvre</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
